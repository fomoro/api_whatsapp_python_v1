<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipe | Centro de mensajes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --pipe-bg: #f5f5f7;
      --pipe-ink: #1d1d1f;
      --pipe-muted: #86868b;
      --pipe-blue: #007aff;
      --pipe-line: rgba(0, 0, 0, .08);
    }

    body {
      background: var(--pipe-bg);
      color: var(--pipe-ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell { height: 100dvh; }
    .content-min { min-height: 0; }
    .scroll-area { min-height: 0; overflow-y: auto; scrollbar-width: thin; }
    .text-pipe-muted { color: var(--pipe-muted); }
    .letter-tight { letter-spacing: -.035em; }
    .hairline { border-color: var(--pipe-line) !important; }

    .frosted {
      background: rgba(255, 255, 255, .78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    .brand-icon,
    .contact-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: var(--pipe-blue);
    }

    .contact-avatar {
      width: 44px;
      height: 44px;
      color: #555;
      background: #e9e9eb;
      font-size: .78rem;
      font-weight: 600;
    }

    .conversation-button { transition: background-color .15s ease; }
    .conversation-button:hover { background: rgba(0, 0, 0, .035); }
    .conversation-button.active { color: inherit; background: rgba(0, 122, 255, .10); }
    .conversation-button.active .contact-avatar { color: #fff; background: var(--pipe-blue); }

    .chat-surface { background: #f7f7f9; }

    .message-bubble {
      max-width: min(72%, 620px);
      white-space: pre-line;
    }

    .message-in .message-bubble {
      background: #e9e9eb;
      border-bottom-left-radius: .3rem !important;
    }

    .message-out .message-bubble {
      color: #fff;
      background: var(--pipe-blue);
      border-bottom-right-radius: .3rem !important;
    }

    .message-out .message-meta { color: rgba(255, 255, 255, .72) !important; }
    .message-meta { font-size: .68rem !important; }
    .status-dot { font-size: .45rem; }

    @media (max-width: 767.98px) {
      .message-bubble { max-width: 88%; }
    }
  </style>
</head>
<body>
  <main class="app-shell container-fluid d-flex flex-column gap-2 gap-md-3 p-2 p-md-3" aria-label="Demo del centro de mensajes de Pipe">
    <nav class="navbar frosted border hairline rounded-4 px-3 py-2" aria-label="Navegación principal">
      <div class="d-flex align-items-center gap-3">
        <span class="brand-icon rounded-3 text-white" aria-hidden="true"><i class="bi bi-chat-dots-fill"></i></span>
        <div>
          <div class="fw-semibold letter-tight">Registro de mensajes</div>
          <div class="small text-pipe-muted">Pipe · WhatsApp</div>
        </div>
      </div>
      <div class="small text-pipe-muted"><i class="bi bi-circle-fill text-success me-1"></i><span class="d-none d-sm-inline">Datos de demostración</span><span class="d-sm-none">Demo</span></div>
    </nav>

    <section class="card border hairline rounded-4 shadow-none overflow-hidden" aria-label="Resumen demostrativo">
      <div class="row g-0" id="metrics"></div>
    </section>

    <section class="card flex-grow-1 content-min overflow-hidden border hairline rounded-4 shadow-sm">
      <div class="row g-0 h-100">
        <aside class="col-12 col-md-4 col-xl-3 h-100 d-flex d-md-flex flex-column border-end content-min" id="conversationPane" aria-label="Conversaciones">
          <header class="d-flex align-items-end justify-content-between p-3 pb-2">
            <div>
              <div class="small text-pipe-muted mb-1">Bandeja de entrada</div>
              <h1 class="h5 fw-semibold letter-tight mb-0">Conversaciones</h1>
            </div>
            <span class="badge rounded-pill text-bg-light border" id="conversationCount"></span>
          </header>

          <div class="p-3 pt-2 border-bottom">
            <div class="input-group mb-3 rounded-pill overflow-hidden border hairline">
              <span class="input-group-text bg-body-tertiary border-0"><i class="bi bi-search text-pipe-muted"></i></span>
              <label class="visually-hidden" for="searchInput">Buscar por número o mensaje</label>
              <input class="form-control bg-body-tertiary border-0 ps-0" id="searchInput" type="search" placeholder="Buscar número o mensaje">
            </div>
            <div class="btn-group btn-group-sm w-100 bg-body-secondary rounded-pill p-1" role="group" aria-label="Filtrar por dirección">
              <button class="btn btn-light shadow-sm rounded-pill border-0 filter-button active" type="button" data-direction="all" aria-pressed="true">Todos</button>
              <button class="btn btn-link text-secondary text-decoration-none rounded-pill border-0 filter-button" type="button" data-direction="inbound" aria-pressed="false">Entrantes</button>
              <button class="btn btn-link text-secondary text-decoration-none rounded-pill border-0 filter-button" type="button" data-direction="outbound" aria-pressed="false">Salientes</button>
            </div>
          </div>

          <div class="list-group list-group-flush scroll-area p-2" id="conversationList"></div>
        </aside>

        <article class="col-12 col-md-8 col-xl-9 h-100 d-none d-md-flex flex-column content-min" id="chatPane" aria-label="Detalle de conversación">
          <header class="d-flex align-items-center gap-3 border-bottom bg-white p-3">
            <button class="btn btn-light border d-md-none" id="backButton" type="button" aria-label="Volver a conversaciones">
              <i class="bi bi-chevron-left"></i>
            </button>
            <span class="contact-avatar rounded-circle" id="selectedAvatar">01</span>
            <div class="flex-grow-1 overflow-hidden">
              <div class="fw-semibold text-truncate" id="selectedName"></div>
              <div class="small text-pipe-muted text-truncate" id="selectedPhone"></div>
            </div>
            <span class="small text-pipe-muted d-none d-sm-inline"><i class="bi bi-circle-fill text-success me-1"></i>WhatsApp activo</span>
          </header>

          <div class="chat-surface scroll-area flex-grow-1 p-3 p-lg-4" id="messageStream" aria-live="polite"></div>

          <footer class="d-flex flex-wrap align-items-center justify-content-between gap-2 border-top hairline bg-white px-3 py-2">
            <div class="small text-pipe-muted"><i class="bi bi-info-circle me-1"></i>Prototipo sin conexión al backend</div>
            <div class="small text-pipe-muted"><span class="me-3">● Entrante</span><span class="text-primary">● Respuesta del bot</span></div>
          </footer>
        </article>
      </div>
    </section>
  </main>

  <script>
    const conversations = [
      {
        id: 'c1', name: 'Cliente 0101', phone: '+57 300 000 0101',
        messages: [
          { direction: 'inbound', text: 'Hola', time: '09:14', status: 'Recibido' },
          { direction: 'outbound', text: 'Hola, ¿cómo estás? Bienvenido a Pipe.\n\nEscribe 0 para ver el menú de opciones.', time: '09:14', status: 'Entregado' },
          { direction: 'inbound', text: '0', time: '09:15', status: 'Recibido' },
          { direction: 'outbound', text: 'Selecciona una opción para continuar:\n\n1. Información\n2. Ubicación\n3. Documento\n4. Audio\n5. Video\n6. Hablar con una persona\n7. Horario', time: '09:15', status: 'Entregado' }
        ]
      },
      {
        id: 'c2', name: 'Cliente 0202', phone: '+57 300 000 0202',
        messages: [
          { direction: 'inbound', text: '2', time: '08:46', status: 'Recibido' },
          { direction: 'outbound', text: 'Esta es la ubicación registrada para el punto de atención.', time: '08:46', status: 'Entregado' }
        ]
      },
      {
        id: 'c3', name: 'Cliente 0303', phone: '+57 300 000 0303',
        messages: [
          { direction: 'inbound', text: 'Quiero hablar con una persona', time: 'Ayer', status: 'Recibido' },
          { direction: 'outbound', text: 'Registramos tu solicitud. Una persona continuará la conversación.', time: 'Ayer', status: 'Enviado' }
        ]
      },
      {
        id: 'c4', name: 'Cliente 0404', phone: '+57 300 000 0404',
        messages: [
          { direction: 'inbound', text: 'Horario', time: 'Ayer', status: 'Recibido' }
        ]
      }
    ];

    let selectedId = conversations[0].id;
    let searchTerm = '';
    let direction = 'all';

    const conversationPane = document.getElementById('conversationPane');
    const chatPane = document.getElementById('chatPane');
    const conversationList = document.getElementById('conversationList');
    const messageStream = document.getElementById('messageStream');

    function initials(phone) {
      return phone.replace(/\D/g, '').slice(-2);
    }

    function visibleConversations() {
      const normalized = searchTerm.toLocaleLowerCase('es');
      return conversations.filter(conversation => {
        const hasDirection = direction === 'all' || conversation.messages.some(message => message.direction === direction);
        const searchable = `${conversation.name} ${conversation.phone} ${conversation.messages.map(message => message.text).join(' ')}`.toLocaleLowerCase('es');
        return hasDirection && searchable.includes(normalized);
      });
    }

    function renderMetrics() {
      const messages = conversations.flatMap(conversation => conversation.messages);
      const pending = conversations.filter(conversation => conversation.messages.at(-1).direction === 'inbound').length;
      const values = [
        [conversations.length, 'Conversaciones'],
        [messages.length, 'Mensajes'],
        [messages.filter(message => message.direction === 'inbound').length, 'Entrantes'],
        [pending, 'Por atender']
      ];

      document.getElementById('metrics').innerHTML = values.map(([value, label], index) => `
        <div class="col-3 ${index < values.length - 1 ? 'border-end hairline' : ''}">
          <div class="text-center py-3 px-1">
            <div class="h4 fw-semibold letter-tight mb-0">${value}</div>
            <div class="small text-pipe-muted text-truncate">${label}</div>
          </div>
        </div>`).join('');
    }

    function renderConversationList() {
      const visible = visibleConversations();
      document.getElementById('conversationCount').textContent = visible.length;

      if (!visible.length) {
        conversationList.innerHTML = `
          <div class="h-100 d-flex align-items-center justify-content-center text-center text-pipe-muted p-4">
            <div><i class="bi bi-search fs-3 d-block mb-2"></i>No encontramos conversaciones con esos filtros.</div>
          </div>`;
        return;
      }

      conversationList.innerHTML = visible.map(conversation => {
        const last = conversation.messages.at(-1);
        const pending = last.direction === 'inbound';
        return `
          <button class="conversation-button list-group-item list-group-item-action border-0 rounded-3 p-3 ${conversation.id === selectedId ? 'active' : ''}" type="button" data-id="${conversation.id}">
            <span class="d-flex align-items-center gap-3">
              <span class="contact-avatar rounded-circle">${initials(conversation.phone)}</span>
              <span class="flex-grow-1 overflow-hidden text-start">
                <span class="d-flex align-items-center justify-content-between gap-2">
                  <span class="fw-semibold text-truncate">${conversation.name}</span>
                  <span class="small text-pipe-muted flex-shrink-0">${last.time}</span>
                </span>
                <span class="small text-pipe-muted d-block text-truncate">${conversation.phone}</span>
                <span class="small d-flex align-items-center gap-2 mt-1">
                  ${pending ? '<i class="bi bi-circle-fill text-primary status-dot" aria-label="Pendiente"></i>' : '<i class="bi bi-check2-all text-primary"></i>'}
                  <span class="text-pipe-muted text-truncate">${last.direction === 'outbound' ? 'Bot: ' : ''}${last.text}</span>
                </span>
              </span>
            </span>
          </button>`;
      }).join('');

      conversationList.querySelectorAll('[data-id]').forEach(button => {
        button.addEventListener('click', () => selectConversation(button.dataset.id));
      });
    }

    function renderSelectedConversation() {
      const conversation = conversations.find(item => item.id === selectedId);
      if (!conversation) return;

      document.getElementById('selectedAvatar').textContent = initials(conversation.phone);
      document.getElementById('selectedName').textContent = conversation.name;
      document.getElementById('selectedPhone').textContent = conversation.phone;

      const filteredMessages = direction === 'all'
        ? conversation.messages
        : conversation.messages.filter(message => message.direction === direction);

      if (!filteredMessages.length) {
        messageStream.innerHTML = `
          <div class="h-100 d-flex align-items-center justify-content-center text-center text-pipe-muted p-4">
            <div><i class="bi bi-funnel fs-3 d-block mb-2"></i>Esta conversación no tiene mensajes con el filtro seleccionado.</div>
          </div>`;
        return;
      }

      messageStream.innerHTML = `
        <div class="small text-center text-pipe-muted mb-4">Hoy</div>
        ${filteredMessages.map(message => `
          <div class="d-flex mb-3 ${message.direction === 'outbound' ? 'justify-content-end message-out' : 'message-in'}">
            <div class="message-bubble border-0 rounded-4 px-3 py-2">
              <div class="small">${message.text}</div>
              <div class="message-meta d-flex align-items-center justify-content-end gap-1 text-pipe-muted mt-1 small">
                <span>${message.time}</span>
                <span>· ${message.status}</span>
                ${message.direction === 'outbound' ? '<i class="bi bi-check2-all text-primary"></i>' : ''}
              </div>
            </div>
          </div>`).join('')}`;
      messageStream.scrollTop = messageStream.scrollHeight;
    }

    function selectConversation(id) {
      selectedId = id;
      renderConversationList();
      renderSelectedConversation();
      if (window.innerWidth < 768) {
        conversationPane.classList.remove('d-flex');
        conversationPane.classList.add('d-none');
        chatPane.classList.remove('d-none');
        chatPane.classList.add('d-flex');
      }
    }

    document.getElementById('searchInput').addEventListener('input', event => {
      searchTerm = event.target.value.trim();
      renderConversationList();
    });

    document.querySelectorAll('.filter-button').forEach(button => {
      button.addEventListener('click', () => {
        direction = button.dataset.direction;
        document.querySelectorAll('.filter-button').forEach(filter => {
          const active = filter === button;
          filter.classList.toggle('btn-light', active);
          filter.classList.toggle('shadow-sm', active);
          filter.classList.toggle('active', active);
          filter.classList.toggle('btn-link', !active);
          filter.classList.toggle('text-secondary', !active);
          filter.classList.toggle('text-decoration-none', !active);
          filter.setAttribute('aria-pressed', active);
        });
        renderConversationList();
        renderSelectedConversation();
      });
    });

    document.getElementById('backButton').addEventListener('click', () => {
      chatPane.classList.remove('d-flex');
      chatPane.classList.add('d-none');
      conversationPane.classList.remove('d-none');
      conversationPane.classList.add('d-flex');
    });

    renderMetrics();
    renderConversationList();
    renderSelectedConversation();
  </script>
</body>
</html>
